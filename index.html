    <!-- ⚡ Bolt Performance Optimization:
    Preconnect to font domains and load fonts via HTML <link> instead of CSS @import.
    This prevents a network request waterfall (HTML -> CSS -> Fonts) and allows
    parallel downloading, significantly improving First Contentful Paint (FCP). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" />
